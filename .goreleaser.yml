version: 2
project_name: webvet
before:
  hooks:
    - go mod tidy
builds:
  - id: webvet
    main: ./cmd/webvet
    binary: webvet
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
